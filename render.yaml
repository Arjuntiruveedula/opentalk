services:
  - type: web
    name: opentalk
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: OPENTALK_JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
