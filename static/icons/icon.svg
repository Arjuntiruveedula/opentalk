<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#grad)" filter="url(#shadow)" />

  <!-- Subtle glow inner border -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Speech bubble & Microphone graphics -->
  <g transform="translate(136, 120)">
    <!-- Speech bubble outline -->
    <path d="M 120 0 C 53.7 0 0 51.5 0 115 C 0 148.6 14.8 178.9 38.6 200.2 C 34.4 223.5 22.8 243.8 22.1 245 C 20.3 248.2 21.6 252.1 24.9 253.9 C 26.3 254.6 27.8 255 29.3 255 C 57.6 255 83.7 241.6 100.8 230 C 107.1 231.3 113.5 232 120 232 C 186.3 232 240 180.5 240 115 C 240 49.5 186.3 0 120 0 Z" fill="#ffffff" fill-opacity="0.15" />
    
    <!-- Centered Microphone Icon -->
    <g transform="translate(70, 40)">
      <!-- Mic Capsule -->
      <rect x="30" y="10" width="40" height="75" rx="20" fill="#ffffff" />
      
      <!-- Mic Arc / Cradle -->
      <path d="M 12 55 C 12 90 35 110 50 110 C 65 110 88 90 88 55" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
      
      <!-- Mic Stem & Base -->
      <line x1="50" y1="110" x2="50" y2="135" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
      <line x1="28" y1="135" x2="72" y2="135" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    </g>
  </g>

  <!-- Accent soundwaves -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8">
    <!-- Left wave -->
    <path d="M 130 215 C 120 235 120 265 130 285" />
    <path d="M 105 195 C 90 225 90 275 105 305" opacity="0.5" />
    <!-- Right wave -->
    <path d="M 382 215 C 392 235 392 265 382 285" />
    <path d="M 407 195 C 422 225 422 275 407 305" opacity="0.5" />
  </g>
</svg>
